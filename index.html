<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>數字大盜！寶藏爭奪戰</title>
<style>
:root{--bg:#e6f3f0;--ink:#12324a;--card:#fff;--line:#b9d8d2;--gold:#f5b82e;--goldink:#4a3300;--sea:#1d6f8a;--ok:#1f9d6b;--mute:#5a7586;--seaink:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c2230;--ink:#e8f3f5;--card:#14394d;--line:#2a5a70;--mute:#9fc0cc;--sea:#5fc0de;--seaink:#06202c}}
:root[data-theme="dark"]{--bg:#0c2230;--ink:#e8f3f5;--card:#14394d;--line:#2a5a70;--mute:#9fc0cc;--sea:#5fc0de;--seaink:#06202c}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.6}
main{max-width:520px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.7rem;margin:8px 0 4px;letter-spacing:.04em}
.sub{color:var(--mute);margin:0 0 24px}
button{font:inherit;cursor:pointer;border:0;color:inherit}
button:focus-visible{outline:3px solid var(--sea);outline-offset:2px}
.level{display:block;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}
.level b{font-size:1.4rem;display:block}
.level span{color:var(--mute)}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.back{background:none;color:var(--sea);padding:6px 0;font-weight:700}
.tag{background:var(--gold);color:var(--goldink);border-radius:99px;padding:2px 14px;font-weight:700}
.seg{display:flex;background:var(--line);border-radius:14px;padding:4px;gap:4px;margin-bottom:10px}
.seg button{flex:1;border-radius:11px;padding:9px 4px;font-weight:700;background:transparent}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.seg.small button{padding:6px 4px}
.q{background:var(--card);border:2px dashed var(--gold);border-radius:22px;padding:18px 16px;min-height:170px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;margin-bottom:14px}
.q.empty{color:var(--mute);font-size:1.1rem}
.badge{background:var(--gold);color:var(--goldink);border-radius:99px;padding:1px 14px;font-weight:700;margin-bottom:8px}
.task{margin:0 0 8px}
.lab{color:var(--mute);font-size:.9rem}
.big{font-size:2.6rem;font-weight:800;line-height:1.2}
.note{margin:10px 0 0;font-size:.9rem;color:var(--mute)}
.main-btn{display:block;width:100%;border-radius:16px;padding:15px;font-size:1.2rem;font-weight:700;margin-bottom:12px}
.draw{background:var(--gold);color:var(--goldink)}
.reveal{background:var(--sea);color:var(--seaink)}
.main-btn[disabled]{opacity:.4;cursor:not-allowed}
.cards-title{font-weight:700;margin:18px 0 8px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.fc{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 2px 8px;text-align:center}
.fc big{display:block;font-size:2rem;font-weight:800;line-height:1.1}
.fc small{color:var(--mute);font-size:.8rem}
.fc.on{border-color:var(--gold);background:var(--gold);color:var(--goldink)}
.fc.on small{color:var(--goldink)}
.result{background:var(--card);border-left:8px solid var(--ok);border-radius:14px;padding:14px 16px;margin-top:6px}
.result .ans{font-size:1.4rem;font-weight:800}
.result .pts{font-size:1.1rem;font-weight:700;color:var(--ok)}
.mask{position:fixed;inset:0;background:rgba(5,20,30,.6);display:flex;align-items:flex-end;justify-content:center;z-index:5}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px))}
.sheet h2{margin:0 0 8px;font-size:1.4rem}
.sheet p{margin:4px 0 10px}
.sheet b{color:var(--sea)}
.row{display:flex;gap:10px;margin-top:14px}
.row button{flex:1;border-radius:14px;padding:13px;font-weight:700;font-size:1.05rem}
.yes{background:var(--gold);color:var(--goldink)}
.no{background:var(--line);color:var(--ink)}
.hide{display:none!important}
</style>
</head>
<body>
<main>
<section id="s1">
  <h1>數字大盜！寶藏爭奪戰</h1>
  <p class="sub">出題小幫手：先選擇難度</p>
  <button class="level" data-lv="easy"><b>簡單</b><span>使用撲克牌 2～5</span></button>
  <button class="level" data-lv="hard"><b>困難</b><span>使用撲克牌 2～10</span></button>
</section>

<section id="s2" class="hide">
  <div class="top"><button class="back" id="back">‹ 重選難度</button><span class="tag" id="lvtag"></span></div>
  <div class="seg" id="modeSeg"><button data-m="solo" class="on">個人版</button><button data-m="coop">合作版</button></div>
  <div class="seg small hide" id="npSeg"><button data-n="2">2 人</button><button data-n="3" class="on">3 人</button><button data-n="4">4 人</button></div>
  <div class="q empty" id="q"></div>
  <button class="main-btn draw" id="draw">抽寶藏卡</button>
  <button class="main-btn reveal" id="show" disabled>公布答案</button>
  <div class="result hide" id="res"></div>
  <div class="cards-title">功能牌（點一下看說明）</div>
  <div class="cards" id="cards"></div>
</section>
</main>
<div class="mask hide" id="mask"><div class="sheet" id="sheet"></div></div>

<script>
var FC={
 solo:{who:"誰拿寶藏？",
  A:{n:"偷牌加倍",d:"先拿左邊玩家 1 張手牌，再出 2 張牌相加。",w:"最接近寶藏數字的人拿雙倍分數！"},
  J:{n:"大盜陷阱",d:"大家蓋著出一張牌，時間到一起翻開。",w:"數字最大的人踩陷阱沒收，由第二大的人拿走寶藏！"},
  Q:{n:"調虎離山",d:"覺得牌不好？把手牌全換掉重新抽 3 張。",w:"這局不搶寶藏，但可以直接加 1 分！"},
  K:{n:"寶藏爭奪戰",d:"出 2 張牌相加，比誰速度快。",w:"算出來剛好等於寶藏數字的人拿到寶藏！"}},
 coop:{who:"怎樣算成功？",
  A:{n:"神偷支援",d:"出牌前，隊伍可以選兩個人互相交換 1 張手牌。",w:"大家出牌相加，剛好等於寶藏數字即可！"},
  J:{n:"避開雷達",d:"全員各出一張牌，把所有出的牌全部加起來。",w:"總和不可以超過寶藏數字，否則算觸發警報失敗！"},
  Q:{n:"道具箱",d:"隊伍自由選擇要全體換新牌，還是直接加 2 分。",w:"不用出牌，直接領取效果！"},
  K:{n:"金庫大決戰",d:"全隊合力剛好打出 3 張牌進行相加。",w:"3 張牌相加必須精準等於寶藏數字才算成功！"}}
};
var level="easy",mode="solo",np=3,cur=null,card=null,pend=null;
function $(i){return document.getElementById(i)}
function r(a,b){return a+Math.floor(Math.random()*(b-a+1))}
function pick(a){return a[r(0,a.length-1)]}
function hi(){return level==="easy"?5:10}
function tgt(t){
 if(Math.random()<.5)return{lab:"寶藏數字",txt:String(t)};
 var a=[],h=hi(),i,x,d;
 if(t>=3){x=r(1,t-1);a.push(x+" + "+(t-x))}
 x=r(2,9);a.push((t+x)+" − "+x);
 for(i=2;i<=h;i++)if(t%i===0&&t/i>=2&&t/i<=h)a.push(i+" × "+(t/i));
 d=r(2,h>5?9:5);a.push((t*d)+" ÷ "+d);
 return{lab:"寶藏密碼（先算出寶藏數字）",txt:pick(a)};
}
function build(){
 var lo=2,h=hi(),k=card,t,g,o={task:"",lab:"",big:"",ans:"",rule:"",note:""};
 function T(v,pre){t=v;g=tgt(v);o.lab=g.lab;o.big=(pre||"")+g.txt;o.ans="寶藏數字 = "+v}
 if(mode==="solo"){
  if(k==="J"){o.task="大家蓋著出 1 張牌，時間到一起翻開。";o.lab="本局玩法";o.big="比大小";o.ans="本局不用算寶藏數字";o.rule="數字最大的人踩到陷阱，寶藏被沒收；第二大的人拿走寶藏，得 1 分。"}
  else if(k==="Q"){o.task="覺得牌不好？把手牌全換掉，重新抽 3 張。";o.lab="本局玩法";o.big="換牌";o.ans="本局不搶寶藏";o.rule="直接加 1 分。"}
  else{
   T(r(2*lo,2*h));
   if(k==="A"){o.task="先拿左邊玩家 1 張手牌，再出 2 張牌相加。";o.rule="最接近 "+t+" 的人拿雙倍分數，得 2 分。"}
   else if(k==="K"){o.task="出 2 張牌相加，比誰速度快！";o.rule="算出來剛好等於 "+t+" 的人拿到寶藏，得 1 分。若沒人剛好等於，這局沒人得分。"}
   else{o.task="出 2 張牌相加。";o.rule="最接近 "+t+" 的人拿分，得 1 分。"}
  }
 }else{
  o.note="溝通暗號：不能直接說出數字（例如不能說「我有 5」），只能說策略（例如「我這局出的數字很大」）。";
  var n=np;
  if(k==="Q"){o.task="不用出牌！隊伍自由選擇：全體換新牌，或直接加 2 分。";o.lab="本局玩法";o.big="道具箱";o.ans="本局不用算寶藏數字";o.rule="領取效果就完成。"}
  else if(k==="J"){
   var av=n*(lo+h)/2;T(Math.min(n*h,r(Math.floor(av),Math.ceil(av)+2)),"不可超過 ");
   o.task="全員各出 1 張牌，把所有出的牌全部加起來。";o.rule="總和不可以超過 "+t+"，否則觸發警報，失敗。成功得 1 分。"}
  else if(k==="K"){T(r(3*lo,3*h));o.task="全隊合力剛好打出 3 張牌相加。";o.rule="3 張牌相加必須剛好等於 "+t+" 才成功，成功得 1 分。"}
  else{T(r(n*lo,n*h));
   o.task=(k==="A"?"出牌前，選兩個人互相交換 1 張手牌。然後":"")+"每人出 1 張牌，全部相加。";
   o.rule="全員出牌相加剛好等於 "+t+" 才成功，成功得 1 分。"}
 }
 return o;
}
function render(){
 var q=$("q");
 if(!cur){q.className="q empty";q.textContent="按下「抽寶藏卡」，取得題目";return}
 q.className="q";
 q.innerHTML=(card?'<span class="badge">'+card+'　'+FC[mode][card].n+'</span>':"")+
  '<p class="task">'+cur.task+'</p><div class="lab">'+cur.lab+'</div><div class="big">'+cur.big+'</div>'+
  (cur.note?'<p class="note">'+cur.note+'</p>':"");
}
function cards(){
 var h="";
 ["A","J","Q","K"].forEach(function(k){
  h+='<button class="fc'+(card===k?" on":"")+'" data-k="'+k+'"><big>'+k+'</big><small>'+FC[mode][k].n+'</small></button>';
 });
 $("cards").innerHTML=h;
}
function reset(){
 cur=null;card=null;render();cards();
 $("show").disabled=true;$("res").classList.add("hide");
 $("npSeg").classList.toggle("hide",mode!=="coop");
}
function draw(){card=null;cur=build();render();cards();$("show").disabled=false;$("res").classList.add("hide")}
function reveal(){
 if(!cur)return;
 var s=$("res");
 s.innerHTML='<div class="ans">'+cur.ans+'</div><div class="pts">'+cur.rule+'</div><p style="margin:6px 0 0;color:var(--mute)">'+(mode==="solo"?"個人版先到 15 分獲勝":"全員合計 20 分，團隊勝利")+'</p>';
 s.classList.remove("hide");
}
function sheet(k){
 pend=k;var f=FC[mode][k];
 $("sheet").innerHTML='<h2>'+k+'　'+f.n+'（'+(mode==="solo"?"個人版":"合作版")+'）</h2>'+
  '<p><b>'+(mode==="solo"?"玩家要做的事":"團隊要做的事")+'</b><br>'+f.d+'</p>'+
  '<p><b>'+FC[mode].who+'</b><br>'+f.w+'</p>'+
  '<div class="row"><button class="no" id="cl">關閉</button><button class="yes" id="ap">'+(card===k?"取消套用":"選擇套用")+'</button></div>';
 $("mask").classList.remove("hide");
 $("cl").onclick=close;
 $("ap").onclick=function(){
  if(!cur){close();return}
  card=(card===pend)?null:pend;
  cur=build();render();cards();$("res").classList.add("hide");close();
 };
}
function close(){$("mask").classList.add("hide")}
document.querySelectorAll(".level").forEach(function(b){b.onclick=function(){
 level=b.dataset.lv;$("s1").classList.add("hide");$("s2").classList.remove("hide");
 $("lvtag").textContent=level==="easy"?"簡單・牌 2～5":"困難・牌 2～10";reset();}});
$("back").onclick=function(){$("s2").classList.add("hide");$("s1").classList.remove("hide")};
$("modeSeg").onclick=function(e){var b=e.target.closest("button");if(!b)return;mode=b.dataset.m;
 [].forEach.call($("modeSeg").children,function(x){x.classList.toggle("on",x===b)});reset()};
$("npSeg").onclick=function(e){var b=e.target.closest("button");if(!b)return;np=+b.dataset.n;
 [].forEach.call($("npSeg").children,function(x){x.classList.toggle("on",x===b)});reset()};
$("draw").onclick=draw;$("show").onclick=reveal;
$("cards").onclick=function(e){var b=e.target.closest(".fc");if(b)sheet(b.dataset.k)};
$("mask").onclick=function(e){if(e.target===$("mask"))close()};
</script>
</body>
</html>
